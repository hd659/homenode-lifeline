[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homenode-lifeline"
version = "0.1.0"
description = "Lifeline monitor for an unattended remote home node: probe redundant paths, track uptime, route repairs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
homenode-lifeline = "homenode_lifeline.cli:main"

[tool.setuptools]
packages = ["homenode_lifeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
